<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Recuperar senha - Rivals Arena</title><link rel="stylesheet" href="style.css"></head>
<body class="page-login">
 <main class="login-container"><h1>RECUPERAR SENHA</h1><p>Informe o e-mail da sua conta para receber um link de recuperação.</p>
 <p class="auth-message" data-auth-message hidden role="status" aria-live="polite"></p>
 <form data-recovery-form hidden style="display:none"><div class="input-group"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div><button class="btn-entrar" type="submit">Enviar link</button></form>
 <p class="auth-link"><a href="login.html">Voltar ao login</a></p></main>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="supabase-config.js"></script><script src="auth.js"></script>
</body></html>
