<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rivals Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-login" data-auth-page="guest">

    <div class="login-container">
        <h1>BEM-VINDO</h1>
        
        <p class="auth-message" data-auth-message hidden role="status"></p>
        <form data-login-form>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@gmail.com" required>
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Insira aqui sua senha" minlength="8" required>
            </div>
                <button type="submit" class="btn-entrar">Entrar</button>
            </form>
            <p class="auth-link"><a href="recuperar-senha.html">Esqueci minha senha</a></p>
            <p class="auth-link">Ainda não tem conta? <a href="cadastro.html">Criar cadastro</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
