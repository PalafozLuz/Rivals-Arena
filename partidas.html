<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partidas - Rivals Arena</title><link rel="stylesheet" href="style.css">
<style>
:root{--pink:#d8466f;--peach:#e2b084;--purple:#471e5e}.matches-page{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}.matches-header{background:linear-gradient(105deg,#481955 0%,#d8466f 58%,#e2b084 100%)}.matches-top{height:54px;display:flex;align-items:center;padding:7px 12px;gap:12px}.matches-logo{width:72px;height:36px;display:flex;align-items:center}.matches-logo img{width:100%;height:100%;object-fit:contain}.matches-search{position:relative;flex:1;height:38px;max-width:337px}.matches-search input{width:100%;height:100%;padding:0 38px 0 17px;border:0;border-radius:22px;background:#eee;color:#222;font-size:14px;outline:0}.matches-search svg{position:absolute;right:10px;top:50%;width:23px;height:23px;transform:translateY(-50%);fill:#000}.matches-menu{width:34px;height:36px;margin-left:auto;padding:3px 0;border:0;background:transparent;cursor:pointer}.matches-menu span{display:block;width:29px;height:3px;margin:6px 0;background:#fff}.mobile-menu{top:53px!important}.matches-nav{height:40px;display:flex;align-items:center;gap:18px;padding:0 15px;background:#351445;overflow:auto;white-space:nowrap}.matches-nav span{font-size:13px;color:#fff}.matches-filters{height:53px;display:flex;align-items:center;gap:11px;padding:7px 15px;overflow:auto;border-bottom:2px solid #bd226c;background:#351445;scrollbar-width:none}.matches-filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;padding:6px 17px;border:0;border-radius:6px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;cursor:pointer}.filter.active,.filter:hover{background:#f08ba5}.matches-main{padding:0 12px;background:#000}.matches-section{margin:0;padding:12px 7px 0}.matches-section h2{margin:0 0 6px;color:#fff;font-size:17px;font-weight:400;line-height:1.1}.matches-section h2 .accent{color:var(--pink);font-weight:700}.matches-section h2 .peach{color:var(--peach);font-weight:700}.matches-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;position:relative}.stream-card{min-width:0;position:relative;overflow:hidden}.stream-thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:#211b2a}.stream-thumb img{width:100%;height:100%;display:block;object-fit:cover}.live{position:absolute;top:5px;left:4px;z-index:1;padding:3px 5px;border-radius:3px;background:#f21e36;color:#fff;font-size:9px;font-weight:700}.stream-info{display:flex;align-items:center;gap:6px;padding:4px 0}.avatar{flex:0 0 24px;width:24px;height:24px;border-radius:50%;object-fit:cover;background:#777}.stream-copy{min-width:0;line-height:1.05}.stream-name{display:block;overflow:hidden;color:#fff;font-size:11px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.stream-meta{display:block;overflow:hidden;color:#ddd;font-size:9px;text-overflow:ellipsis;white-space:nowrap}.section-arrow{position:absolute;right:-10px;top:50%;z-index:3;width:22px;height:38px;padding:0;border:0;background:transparent;color:#fff;font-size:30px;line-height:30px;cursor:pointer}.section-arrow.prev{display:none}.matches-section:nth-child(1) h2 .accent,.matches-section:nth-child(2) h2 .accent{color:var(--pink)}.matches-section:nth-child(3) h2 .accent{color:var(--pink)}.matches-section:nth-child(4) h2 .accent{color:var(--pink)}
@media(min-width:900px){.matches-top{height:76px;padding:10px 24px}.matches-logo{width:92px;height:42px}.matches-search{height:48px;max-width:520px;margin:auto}.matches-nav{height:48px;padding-left:25px}.matches-filters{height:56px;padding-left:25px}.matches-main{max-width:1440px;margin:auto;padding:0 25px}.matches-section{padding:18px 0 0}.matches-section h2{font-size:22px}.matches-row{gap:20px}.stream-name{font-size:13px}.stream-meta{font-size:10px}}
.matches-main{display:block!important;width:100%;max-width:none!important;margin:0!important;padding:0 20px!important}
.matches-section{width:100%}
.matches-row{grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2.2vw,32px);width:100%}
.stream-card{width:auto!important;min-width:0!important}
@media(max-width:768px){.matches-main{padding:0 12px!important}.matches-section{padding:14px 7px 0}.matches-row{display:flex;grid-template-columns:none;gap:16px;overflow-x:auto;padding:0 0 4px;scrollbar-width:none;scroll-snap-type:x proximity}.matches-row::-webkit-scrollbar{display:none}.matches-row .stream-card{flex:0 0 clamp(138px,calc((100vw - 48px)/4),340px);width:clamp(138px,calc((100vw - 48px)/4),340px)!important;scroll-snap-align:start}.matches-section h2{font-size:clamp(16px,4vw,21px)}.section-arrow{right:-3px}}
@media(min-width:1100px){.matches-main{padding:0 7px!important}.matches-row{grid-template-columns:repeat(4,minmax(0,340px));justify-content:space-between;gap:clamp(14px,1.4vw,25px)}.matches-section{padding-top:18px}.stream-thumb{border-radius:7px}.stream-info{padding-top:7px}.stream-name{font-size:clamp(11px,1vw,16px)}.stream-meta{font-size:clamp(9px,.75vw,12px)}}
</style></head>
<body class="matches-page" data-auth-page="protected">
<header class="matches-header">
 <div class="matches-top">
  <a class="matches-logo" href="homepage.html" aria-label="Rivals Arena - início"><img src="imagens/logo-menu.png" alt="Rivals Arena"></a>
  <form id="matches-search" class="matches-search" role="search"><input id="matches-search-input" type="search" aria-label="Pesquisar time, campeonato ou jogo" placeholder="Time, campeonato ou jogo"><button type="submit" aria-label="Pesquisar">⌕</button></form>
  <button class="matches-menu menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
 </div>
 <nav class="mobile-menu" aria-label="Menu principal"><a href="homepage.html">Início</a><a href="perfil.html">Perfil</a><a href="comunidade.html">Comunidade</a><a href="campeonatos.html">Campeonatos</a><a href="partidas.html">Partidas</a></nav>
 <nav class="matches-nav" aria-label="Participação"><button class="filter" data-mine="0" aria-pressed="true">Todas</button><button class="filter" data-mine="1" aria-pressed="false">Meus times</button></nav>
 <div class="matches-filters" aria-label="Status das partidas"><button class="filter" data-status="todos" aria-pressed="true">Todos os status</button><button class="filter" data-status="agendada" aria-pressed="false">Agendadas</button><button class="filter" data-status="em_andamento" aria-pressed="false">Em andamento</button><button class="filter" data-status="finalizada" aria-pressed="false">Finalizadas</button><button class="filter" data-status="cancelada" aria-pressed="false">Canceladas</button></div>
</header>
<main class="matches-main">
 <h1>Partidas da arena</h1>
 <p id="matches-message" role="status" aria-live="polite">Carregando partidas...</p>
 <div class="arena-actions"><p id="matches-context"></p><button id="matches-clear">Limpar filtros</button><a class="arena-link" href="campeonatos.html">Ver campeonatos</a></div>
 <section id="match-detail" class="arena-section" aria-label="Confronto selecionado" hidden></section>
 <section id="matches-grid" class="arena-grid" aria-label="Lista de partidas"></section>
 <div class="arena-actions"><button id="matches-prev" disabled>Anterior</button><span id="matches-page">Página 1</span><button id="matches-next" disabled>Próxima</button></div>
</main>
<script src="menu.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="arena-dados.js"></script>
</body></html>
