<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Rivals Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-login" data-auth-page="guest">
    <div class="login-container">
        <h1>CRIAR CONTA</h1>
        <p class="auth-message" data-auth-message hidden role="status"></p>
        <form data-signup-form>
            <div class="input-group"><label for="nome">Nome</label><input id="nome" name="nome" required></div>
            <div class="input-group"><label for="username">Nome de usuário</label><input id="username" name="username" pattern="[A-Za-z0-9_]{3,50}" required></div>
            <div class="input-group"><label for="email">E-mail</label><input type="email" id="email" name="email" required></div>
            <div class="input-group"><label for="senha">Senha</label><input type="password" id="senha" name="senha" minlength="8" required></div>
            <div class="input-group"><label for="confirmarSenha">Confirmar senha</label><input type="password" id="confirmarSenha" name="confirmarSenha" minlength="8" required></div>
            <button type="submit" class="btn-entrar">Criar conta</button>
        </form>
        <p class="auth-link">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
